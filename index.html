<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Adjectives Quest - Fun Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #e0f7fa 0%, #80deea 30%, #4dd0e1 70%, #26c6da 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #004d40;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Underwater Container */
        .ocean-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .sunbeam {
            position: absolute;
            top: -50px;
            width: 100%;
            height: 300px;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 2;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            animation: floatBubble linear infinite;
        }

        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .fish {
            position: absolute;
            font-size: 28px;
            z-index: 3;
            animation: swim linear infinite;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes swim {
            0% { transform: translateX(-10vw) scaleX(1); }
            50% { transform: translateX(110vw) scaleX(1); }
            50.1% { transform: translateX(110vw) scaleX(-1); }
            100% { transform: translateX(-10vw) scaleX(-1); }
        }

        .sea-bed {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(0deg, #ffe082 0%, rgba(255, 224, 130, 0) 100%);
            z-index: 2;
        }

        .coral-group {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 2;
            padding: 0 20px;
            font-size: 45px;
        }

        .sea-plant {
            animation: sway 4s infinite alternate ease-in-out;
            transform-origin: bottom center;
            display: inline-block;
        }

        .sea-plant:nth-child(even) {
            animation-duration: 6s;
            animation-direction: alternate-reverse;
        }

        @keyframes sway {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        /* Container Kejutan (Bintang & Pita Emas) */
        #celebrationContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .reward-item {
            position: absolute;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Game Card Styling */
        .game-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 4px solid #80deea;
            box-shadow: 0 20px 40px rgba(0, 77, 64, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 25px;
            width: 90%;
            max-width: 480px;
            text-align: center;
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e0f7fa;
            padding: 10px 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 2px solid #b2ebf2;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4dd0e1, #26a69a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(38, 166, 154, 0.4);
            border: 3px solid #ffffff;
        }

        .stats-group {
            text-align: right;
            font-family: 'Fredoka', sans-serif;
        }

        .stat-item {
            font-size: 13px;
            color: #00796b;
            font-weight: 600;
        }

        .stat-value {
            color: #004d40;
            font-weight: 700;
            font-size: 18px;
        }

        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 26px;
            letter-spacing: 1px;
            color: #00695c;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px #ffffff;
        }

        .progress-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            color: #00897b;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .question-box {
            background: #f0fdfd;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #b2ebf2;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-img {
            max-width: 100%;
            height: 140px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        .question {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #004d40;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #80deea;
            border-radius: 14px;
            padding: 12px 8px;
            color: #00695c;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            outline: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: #e0f7fa;
            border-color: #26c6da;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: #26c6da;
            color: #ffffff;
            border-color: #0097a7;
            box-shadow: 0 4px 12px rgba(38, 198, 218, 0.4);
        }

        .select-box {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            border: 2px solid #80deea;
            border-radius: 14px;
            background: #ffffff;
            color: #004d40;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #26c6da, #0097a7);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 151, 167, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 151, 167, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(135deg, #26a69a, #00796b);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 121, 107, 0.3);
        }

        .feedback {
            margin-top: 10px;
            font-weight: 700;
            min-height: 24px;
            font-size: 16px;
            font-family: 'Fredoka', sans-serif;
        }

        .feedback.correct { color: #2e7d32; }
        .feedback.wrong { color: #c62828; }

        .screen { display: none; }
        .active-screen { display: block; }

        .final-score {
            font-family: 'Fredoka', sans-serif;
            font-size: 55px;
            color: #00796b;
            text-shadow: 2px 2px 0px #e0f7fa;
            margin: 10px 0;
        }

        .result-details {
            font-size: 16px;
            color: #004d40;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .saving-status {
            font-size: 14px;
            color: #00796b;
            margin-top: 10px;
            font-weight: bold;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen active-screen">
            <div class="avatar" style="margin: 0 auto 15px auto; width: 75px; height: 75px; font-size: 40px;">🥽</div>

            <p style="color: #00695c; margin-bottom: 20px; font-size: 14px; font-weight: 600;">Pilih namamu sebelum menyelam ke taman laut!</p>
            
            <form id="loginForm" onsubmit="startGame(event)">
                <select id="studentSelect" class="select-box" required>
                    <option value="">-- Memuat Nama Siswa... --</option>
                </select>
                <button type="submit" class="btn btn-start" id="startBtn" disabled>Mulai Menyelam 🦭</button>

        <!-- QUIZ SCREEN -->

            <div class="question-box">
                <img id="questionImage" class="question-img" src="" alt="Gambar Soal" style="display: none;" />
                <div class="question" id="questionText">Memuat Soal...</div>
            </div>

            <form id="quizForm" onsubmit="checkAnswer(event)">
                <div class="options-grid" id="optionsContainer"></div>
                <button type="submit" class="btn btn-submit" id="submitBtn" disabled>Kirim Jawaban 🌊</button>
            </form>

            <div class="feedback" id="feedbackText"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="screen">
           <div class="avatar" id="finalAvatar" style="margin: 0 auto 15px auto; width: 80px; height: 80px; font-size: 45px;">🏆</div>
            <h1 class="title">MISI SELESAI!</h1>
            <p style="color: #00695c; font-weight: 600;">NILAI AKHIR KAMU:</p>
            <div class="final-score" id="finalScore">0</div>
            
            <div class="result-details" id="resultDetails"></div>
            <div class="saving-status" id="savingStatus">💾 Menyimpan skor</div>
        </div>

    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCU4vFsCSdKGHKyAaPTGcwh-CbEoAwLzB0ZeK4GHOGdEetypgYox-VFg_wwpIVtXtX7Q/exec";

        const TOTAL_QUESTIONS = 20;
        const POINTS_PER_QUESTION = 5;

        // 20 SOAL BERBEDA (TIDAK ADA GAMBAR/TEMA/KATA SIFAT YANG SAMA)

        ];

        let selectedStudentName = "";
        let currentQuestion = 1;
        let selectedOption = null;
        let score = 0;
        let correctCount = 0;

        const avatars = ["🥽", "🐠", "🐙", "🐬", "🦈", "🧜‍♂️", "🏆"];

        /* Audio Synthesis untuk Suara Benar & Salah */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        /* Efek Kejutan: Bintang & Pita Emas Jatuh */
        function triggerCelebration() {
            const container = document.getElementById('celebrationContainer');
            const items = ['⭐', '🌟', '✨', '🎗️', '🎀', '🥇'];
            
            for (let i = 0; i < 30; i++) {
                const item = document.createElement('div');
                item.className = 'reward-item';
                item.innerText = items[Math.floor(Math.random() * items.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.fontSize = (Math.random() * 20 + 20) + 'px';
                item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                item.style.animationDelay = (Math.random() * 0.3) + 's';
                
                container.appendChild(item);

                setTimeout(() => {
                    item.remove();
                }, 2500);
            }
        }

        function createBubbles() {
            const container = document.getElementById('bubblesContainer');
            for (let i = 0; i < 35; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 16 + 6;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 8 + 4}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(bubble);
            }
        }

        async function fetchStudentNames() {
            const selectElem = document.getElementById('studentSelect');
            const startBtn = document.getElementById('startBtn');
            const feedback = document.getElementById('loginFeedback');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                if (data.names && data.names.length > 0) {
                    selectElem.innerHTML = '<option value="">-- Pilih Namamu --</option>';
                    data.names.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        selectElem.appendChild(opt);
                    });
                    startBtn.disabled = false;
                } else {
                    selectElem.innerHTML = '<option value="">-- Tidak Ada Nama Ditemukan --</option>';
                    feedback.innerText = "Daftar nama di Google Sheets masih kosong!";
                }
            } catch (err) {
                console.error(err);
                selectElem.innerHTML = '<option value="">-- Gagal Memuat --</option>';
                feedback.innerText = "Gagal terhubung ke Google Sheets.";
            }
        }

        function startGame(event) {
            event.preventDefault();
            const selectElem = document.getElementById('studentSelect');
            selectedStudentName = selectElem.value;

            if (!selectedStudentName) return;

            document.getElementById('displayName').innerText = selectedStudentName;
            document.getElementById('loginScreen').classList.remove('active-screen');
            document.getElementById('quizScreen').classList.add('active-screen');

            generateQuestion();
        }

        function generateQuestion() {
            const q = questionBank[currentQuestion - 1];
            selectedOption = null;

            document.getElementById('progressText').innerText = `SOAL ${currentQuestion} DARI ${TOTAL_QUESTIONS}`;
            document.getElementById('questionText').innerText = q.text;
            
            const imgElem = document.getElementById('questionImage');
            if (q.image && q.image.trim() !== "") {
                imgElem.src = q.image;
                imgElem.style.display = "block";
            } else {
                imgElem.style.display = "none";
                imgElem.src = "";
            }

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, opt);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('submitBtn').disabled = true;
        }

        function selectOption(btnElem, value) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.remove('selected'));

            btnElem.classList.add('selected');
            selectedOption = value;
            document.getElementById('submitBtn').disabled = false;
        }

        function checkAnswer(event) {
            event.preventDefault();
            if (!selectedOption) return;

            const submitBtn = document.getElementById('submitBtn');
            const feedback = document.getElementById('feedbackText');
            const gameCard = document.getElementById('gameCard');
            const currentQ = questionBank[currentQuestion - 1];

            submitBtn.disabled = true;
            document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');

            if (selectedOption === currentQ.answer) {
                score += POINTS_PER_QUESTION;
                correctCount += 1;
                
                playSound('correct');
                triggerCelebration();

                feedback.innerText = "✨ Pintar! Jawabanmu Benar!";
                feedback.className = "feedback correct";
            } else {
                playSound('wrong');

                feedback.innerText = "💥 Ooo! Jawaban Kurang Tepat!";
                feedback.className = "feedback wrong";

                gameCard.classList.add('shake');
                setTimeout(() => gameCard.classList.remove('shake'), 400);
            }

            document.getElementById('score').innerText = score;
            updateAvatar();

            setTimeout(() => {
                feedback.innerText = "";
                if (currentQuestion < TOTAL_QUESTIONS) {
                    currentQuestion++;
                    generateQuestion();
                } else {
                    showFinalResult();
                }
            }, 1400);
        }

        function updateAvatar() {
            const avatarElem = document.getElementById('avatarIcon');
            if (correctCount < 4) avatarElem.innerText = avatars[0];
            else if (correctCount < 8) avatarElem.innerText = avatars[1];
            else if (correctCount < 12) avatarElem.innerText = avatars[2];
            else if (correctCount < 16) avatarElem.innerText = avatars[3];
            else if (correctCount < 19) avatarElem.innerText = avatars[4];
            else avatarElem.innerText = avatars[6];
        }

        async function showFinalResult() {
            document.getElementById('quizScreen').classList.remove('active-screen');
            document.getElementById('resultScreen').classList.add('active-screen');

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalAvatar').innerText = document.getElementById('avatarIcon').innerText;

            triggerCelebration();

            const accuracy = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            document.getElementById('resultDetails').innerHTML = `
                Siswa: <b>${selectedStudentName}</b><br>
                Jawaban Benar: <b>${correctCount} / ${TOTAL_QUESTIONS}</b><br>
                Akurasi: <b>${accuracy}%</b>
            `;

            await saveScoreToSheet(selectedStudentName, score);
        }

        async function saveScoreToSheet(name, scoreValue) {
            const statusElem = document.getElementById('savingStatus');
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, score: scoreValue })
                });

                statusElem.innerText = "✅ Skor berhasil disimpan!";
                statusElem.style.color = "#2e7d32";
            } catch (err) {
                console.error(err);
                statusElem.innerText = "⚠️ Gagal menyimpan skor otomatis.";
                statusElem.style.color = "#c62828";
            }
        }

        window.onload = () => {
            createBubbles();
            fetchStudentNames();
        };
    </script>
</body>
</html>
